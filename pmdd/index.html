<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GLORY</title>
    <meta name="application-name" content="GLORY" />
    <meta name="apple-mobile-web-app-title" content="GLORY" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16121a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M4%2016a8%208%200%200%201%2016%200'%20fill='none'%20stroke='%236B2D5C'%20stroke-width='2.4'%20stroke-linecap='round'/%3E%3Cpath%20d='M2.5%2019.5h19'%20fill='none'%20stroke='%233D5A63'%20stroke-width='2.4'%20stroke-linecap='round'/%3E%3Ccircle%20cx='12'%20cy='8'%20r='1.8'%20fill='%236B2D5C'/%3E%3C/svg%3E"
    />
    <script>
      // Stamp the saved theme before first paint so night mode doesn't flash light.
      try {
        var t = localStorage.getItem('glory_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
